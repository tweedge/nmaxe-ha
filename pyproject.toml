[project]
name = "nmaxe"
version = "0.3.2"
description = "Home Assistant custom integration for NMAxe-family AxeOS miners"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.coverage.run]
source = ["custom_components/nmaxe"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py313"
required-version = ">=0.17.2"
line-length = 88
extend-exclude = [".venv"]

